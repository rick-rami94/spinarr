name: CI

# Required checks on main are the job ids below: macos, linux, windows, audit.
# Do not rename them, add a `name:` key to a job, or add a `paths:` filter: any of those
# would orphan a required check (a check that never reports blocks every PR).
#
# Supply chain: every action is pinned to a commit SHA (Dependabot keeps them fresh), Node
# comes from .nvmrc, meson and zizmor install with --require-hashes, and runner images are
# pinned. Floating inputs that cannot be pinned cheaply are marked as documented exceptions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      ORACLE_FFMPEG_DIR: /opt/homebrew/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # libdvdcss is a test-only dependency: it exercises the CSS paths in CI and is never
      # shipped or fetched by Spinarr (D-21). Homebrew formulas float; documented exception to D-16.
      - name: Install build and test tools
        run: brew install meson ninja nasm pkg-config libdvdcss ffmpeg dvdauthor cmake freetype

      - name: Cache engine dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/deps/*.tar.xz
          key: engine-src-${{ hashFiles('engine/build.sh') }}

      - run: npm ci
      - name: Build engine (verified sources + patches)
        run: npm run engine
      - name: Generate test DVDs and Blu-rays (tsMuxeR is built from source)
        run: npm run fixtures

      - run: npm run test:unit
      - run: npm run test:security
      - run: npm run test:engine
      - name: End-to-end (drives the real app)
        run: npm run test:e2e

      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-macos
          path: test/reports/

  linux:
    runs-on: ubuntu-22.04 # glibc 2.35 is the oldest supported Linux target; keep it
    timeout-minutes: 60
    env:
      ORACLE_FFMPEG_DIR: /usr/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # apt packages come from the signed Ubuntu archive (documented exception to D-16).
      # meson is pinned and hash-verified.
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build nasm pkg-config patch xz-utils \
            ffmpeg dvdauthor genisoimage fonts-dejavu-core cmake libfreetype-dev zlib1g-dev bubblewrap xvfb
          pip3 install --user --require-hashes -r .github/requirements-build.txt

      - name: Cache engine dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/deps/*.tar.xz
          key: engine-src-${{ hashFiles('engine/build.sh') }}

      - run: npm ci
      - name: Build engine (verified sources + patches)
        run: npm run engine
      - name: Third-party notices are current
        run: node scripts/gen-notices.js --check
      # cyclonedx-cli is a release binary pinned by version and SHA-256. To bump it: pick the
      # version, take the cyclonedx-linux-x64 asset digest from
      # `gh release view vX.Y.Z -R CycloneDX/cyclonedx-cli --json assets`, check it against a
      # local download (`sha256sum cyclonedx-linux-x64`), and update both values below.
      - name: SBOM is valid CycloneDX 1.6
        env:
          CDX_VERSION: v0.33.1
          CDX_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          cdx="$RUNNER_TEMP/cyclonedx"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$cdx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/$CDX_VERSION/cyclonedx-linux-x64"
          echo "$CDX_SHA256  $cdx" | sha256sum -c -
          chmod +x "$cdx"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node scripts/gen-sbom.js --version 0.0.0-ci --out "$RUNNER_TEMP/spinarr.cdx.json"
          "$cdx" validate --input-file "$RUNNER_TEMP/spinarr.cdx.json" --input-format json --input-version v1_6 --fail-on-errors
      - name: Generate test DVDs and Blu-rays
        run: npm run fixtures

      # Coverage runs on Linux only (D-13): unit, security and engine suites under c8.
      - name: Unit, security and engine tests with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage (Linux)'
            echo '```'
            npx c8 report --reporter=text-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: coverage/

      - name: End-to-end (real app under Xvfb, engine in bubblewrap)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run test:e2e

      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-linux
          path: test/reports/

      # Windows can't author DVDs, so its engine and end-to-end runs use these discs. `src/`
      # (the reference .mpg files the lossless oracle compares rips against) is included.
      # Names with characters Windows forbids (the XSS fixtures) and the unused `bdsrc/` are left out.
      - name: Share the generated test discs with the Windows job
        run: tar czf fixtures.tgz -C test/fixtures/out --exclude='*[<>"]*' --exclude=bdsrc .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: fixtures.tgz
          retention-days: 1

  windows:
    needs: linux # uses the test discs the Linux job generates
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          # Documented exception to D-16: pacman packages float (signed MSYS2 repos).
          update: true
          install: >-
            make patch tar xz curl diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache engine dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/deps/*.tar.xz
          key: engine-src-win-${{ hashFiles('engine/build.sh') }}

      - name: Build engine (verified sources + patches)
        shell: msys2 {0}
        env:
          CC: gcc
        run: sh engine/build.sh

      - run: npm ci
      - run: npm run test:unit
      - name: Engine smoke test
        shell: bash
        run: |
          engine/bin/ffmpeg.exe -hide_banner -version | head -1
          out=$(engine/bin/dvdinfo.exe "C:/no/such/disc" || true); echo "$out"; echo "$out" | grep -q '"error"'
          out=$(engine/bin/bdinfo.exe "C:/no/such/disc" || true); echo "$out"; echo "$out" | grep -q '"error"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fixtures
      - name: Unpack test discs
        shell: bash
        run: mkdir -p test/fixtures/out && tar xzf fixtures.tgz -C test/fixtures/out && ls test/fixtures/out

      # The engine's own ffmpeg is remux-only and is the thing under test, so it cannot be the
      # oracle. This independent build is test-only and never packaged. Only the downloaded zip is
      # cached; its SHA-256 is recomputed on every run, cache hit or not.
      - name: Cache the ffmpeg oracle download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oracle-dl
          key: ffmpeg-oracle-db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec
      - name: Independent ffmpeg oracle (test-only, pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url  = 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip'
          $want = 'DB580001CAA24AC104C8CB856CD113A87B0A443F7BDF47D8C12B1D740584A2EC'
          $dl   = Join-Path $env:RUNNER_TEMP 'oracle-dl'
          $zip  = Join-Path $dl 'ffmpeg-8.1.2-essentials_build.zip'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          if (-not (Test-Path $zip)) { Invoke-WebRequest -Uri $url -OutFile $zip }
          $got = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($got -ne $want) {
            Remove-Item -Force $zip
            throw "ffmpeg oracle checksum mismatch: got $got, want $want"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'oracle'
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = Join-Path (Get-ChildItem -Path $dest -Directory)[0].FullName 'bin'
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          "ORACLE_FFMPEG_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: npm run test:security
      - run: npm run test:engine
      - name: End-to-end (drives the real app; no engine sandbox on Windows)
        run: npm run test:e2e
      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-windows
          path: test/reports/

      - name: Package (unpacked) to check the installer config
        run: npx electron-builder --win --dir --publish never

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # audit from a clean install, no restored cache
      - run: npm ci --ignore-scripts
      - name: Electron advisories (Electron is the shipped runtime)
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json').vulnerabilities||{};if(a.electron){console.error('Electron advisory:',JSON.stringify(a.electron.via,null,1));process.exit(1)}console.log('No advisories affect electron.')"
      - name: Whole tree at high
        run: npm audit --audit-level=high
      - name: Registry signatures
        run: npm audit signatures
      - name: Workflow lint (zizmor)
        env:
          # Read-only token so the online audits (impostor-commit, known-vulnerable-actions) run.
          GH_TOKEN: ${{ github.token }}
        run: |
          pip3 install --user --require-hashes -r .github/requirements-audit.txt
          ~/.local/bin/zizmor --format plain --min-severity medium .github/workflows
