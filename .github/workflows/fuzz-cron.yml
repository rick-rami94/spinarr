name: Fuzz (scheduled)

# Scheduled fuzzing (SAFE-10, D-11): a nightly 1-hour-per-target batch run, and a weekly corpus
# prune plus coverage summary. The corpus lives in the private rick-rami94/spinarr-fuzz-corpus repo
# (corpus/<target>/, crashes/<target>/<signature>/, coverage/<date>/summary.txt).
#
# Privacy model (D-09): crash inputs and stack traces never leave the runner except to the
# private corpus repo and private draft security advisories. This log is public. ALL fuzzer output
# goes to $RUNNER_TEMP/fuzz.log, which is never printed or uploaded; scripts/fuzz-report.js prints
# only an advisory link. Never add artifact uploads, the CFLite run-fuzzers action, SARIF output
# or upload, or the PR-target trigger to this workflow (test/unit/fuzz-workflows.test.js
# enforces this).
#
# Credentials (plan 02-04 decision: GitHub App): vars.FUZZ_APP_ID (App ID or Client ID) and
# secrets.FUZZ_APP_PRIVATE_KEY in environment `fuzz`. A token is minted right before each use,
# scoped to the one repository that step needs, and revoked when the job ends.
#
# Supply chain: every action is pinned to a commit SHA. Documented exception to D-16: the CFLite
# build_fuzzers action runs the floating image gcr.io/oss-fuzz-base/clusterfuzzlite-build-fuzzers:v1
# (set inside the pinned action.yml). It only orchestrates the build; the compiler image comes from
# .clusterfuzzlite/Dockerfile, which pins base-builder by digest. Fuzzers run only through
# scripts/fuzz-run.sh, which pins the run-fuzzers image by digest and runs it with --network none.
on:
  schedule:
    - cron: '17 3 * * *' # nightly batch
    - cron: '41 4 * * 0' # weekly prune + coverage
  workflow_dispatch:
    inputs:
      mode:
        description: Which job to run
        type: choice
        options: [batch, prune, coverage]
        default: batch

permissions:
  contents: read

# One writer to the private corpus at a time; never cancel a run that is mid-push.
concurrency:
  group: fuzz-corpus
  cancel-in-progress: false

jobs:
  batch:
    if: github.event.schedule == '17 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'batch')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the address-sanitizer fuzzers into $GITHUB_WORKSPACE/build-out. Uploads nothing.
      - name: Build fuzzers (ASan)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ github.token }}
          upload-build: false
          keep-unaffected-fuzz-targets: true

      - name: Mint corpus token (clone)
        id: clone-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      # GitHub masks the raw token but not its base64 form, so mask that before using it.
      - name: Clone the private corpus
        id: clone
        env:
          CORPUS_TOKEN: ${{ steps.clone-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            clone --quiet https://github.com/rick-rami94/spinarr-fuzz-corpus.git "$RUNNER_TEMP/corpus-repo"

      # High-entropy ASLR (mmap_rnd_bits=32) makes ASan die with DEADLYSIGNAL on GitHub's
      # Ubuntu runners: actions/runner-images#9515.
      - name: Allow ASan on GitHub runners
        run: sudo sysctl vm.mmap_rnd_bits=28

      # Exit 0 = no crash, 3 = crash, anything else = infrastructure failure.
      - name: Fuzz (batch, 3600 s per target)
        id: fuzz
        run: |
          status=0
          sh scripts/fuzz-run.sh --mode batch --seconds 3600 --build-out build-out \
            --corpus "$RUNNER_TEMP/corpus-repo/corpus" --crashes "$RUNNER_TEMP/crashes" --log "$RUNNER_TEMP/fuzz.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Mint advisory token (draft advisories on spinarr)
        id: advisory-token
        if: steps.fuzz.outputs.status == '3'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr
          # Not in the action's generated input list (the runner warns), but the action reads
          # every permission-* input, so the token gets this one permission and nothing else.
          permission-repository-advisories: write

      # Exit 1 means "crashes reported" and is expected here; 2 is an API or usage failure.
      - name: Report crashes privately
        if: steps.fuzz.outputs.status == '3'
        env:
          FUZZ_ADVISORY_TOKEN: ${{ steps.advisory-token.outputs.token }}
        run: |
          rc=0
          node scripts/fuzz-report.js --crashes "$RUNNER_TEMP/crashes" --corpus-repo "$RUNNER_TEMP/corpus-repo" --mode nightly || rc=$?
          [ "$rc" -le 1 ]

      - name: Mint corpus token (push)
        id: push-token
        if: "!cancelled() && steps.clone.outcome == 'success' && (steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '3')"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      # Pushes the grown corpus and any new crash signatures (reproducers are stored even if the
      # advisory call failed). Retries with a rebase in case a PR run pushed crashes meanwhile.
      - name: Push corpus and crashes to the private repo
        if: "!cancelled() && steps.clone.outcome == 'success' && (steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '3')"
        env:
          CORPUS_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd "$RUNNER_TEMP/corpus-repo"
          git add -A corpus
          [ ! -d crashes ] || git add crashes
          if git diff --cached --quiet; then echo "nothing new to push"; exit 0; fi
          git -c user.name=spinarr-fuzz-bot -c user.email=noreply@github.com \
            commit --quiet -m "nightly batch: corpus and crashes $(date -u +%F)"
          branch=$(git symbolic-ref --short HEAD)
          for attempt in 1 2 3; do
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push --quiet origin "HEAD:$branch"; then exit 0; fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" pull --quiet --rebase origin "$branch"
          done
          echo "push to the private corpus failed" >&2
          exit 1

      - name: Result
        if: always()
        env:
          STATUS: ${{ steps.fuzz.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo "no crashes" ;;
            3) echo "fuzzing found a new crash; see the private advisory linked above" >&2; exit 1 ;;
            *) echo "fuzz infrastructure failure" >&2; exit 1 ;;
          esac

  prune:
    if: github.event.schedule == '41 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'prune')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fuzzers (ASan)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ github.token }}
          upload-build: false
          keep-unaffected-fuzz-targets: true

      - name: Mint corpus token (clone)
        id: clone-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      - name: Clone the private corpus
        id: clone
        env:
          CORPUS_TOKEN: ${{ steps.clone-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            clone --quiet https://github.com/rick-rami94/spinarr-fuzz-corpus.git "$RUNNER_TEMP/corpus-repo"

      - name: Allow ASan on GitHub runners
        run: sudo sysctl vm.mmap_rnd_bits=28

      # Prune keeps only inputs that add coverage. A crash here goes through the same private path.
      - name: Prune the corpus
        id: fuzz
        run: |
          status=0
          sh scripts/fuzz-run.sh --mode prune --seconds 600 --build-out build-out \
            --corpus "$RUNNER_TEMP/corpus-repo/corpus" --crashes "$RUNNER_TEMP/crashes" --log "$RUNNER_TEMP/fuzz.log" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Mint advisory token (draft advisories on spinarr)
        id: advisory-token
        if: steps.fuzz.outputs.status == '3'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr
          permission-repository-advisories: write

      - name: Report crashes privately
        if: steps.fuzz.outputs.status == '3'
        env:
          FUZZ_ADVISORY_TOKEN: ${{ steps.advisory-token.outputs.token }}
        run: |
          rc=0
          node scripts/fuzz-report.js --crashes "$RUNNER_TEMP/crashes" --corpus-repo "$RUNNER_TEMP/corpus-repo" --mode nightly || rc=$?
          [ "$rc" -le 1 ]

      - name: Mint corpus token (push)
        id: push-token
        if: "!cancelled() && steps.clone.outcome == 'success' && (steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '3')"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      - name: Push the pruned corpus to the private repo
        if: "!cancelled() && steps.clone.outcome == 'success' && (steps.fuzz.outputs.status == '0' || steps.fuzz.outputs.status == '3')"
        env:
          CORPUS_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          cd "$RUNNER_TEMP/corpus-repo"
          git add -A corpus
          [ ! -d crashes ] || git add crashes
          if git diff --cached --quiet; then echo "nothing new to push"; exit 0; fi
          git -c user.name=spinarr-fuzz-bot -c user.email=noreply@github.com \
            commit --quiet -m "weekly prune: corpus $(date -u +%F)"
          branch=$(git symbolic-ref --short HEAD)
          for attempt in 1 2 3; do
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push --quiet origin "HEAD:$branch"; then exit 0; fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" pull --quiet --rebase origin "$branch"
          done
          echo "push to the private corpus failed" >&2
          exit 1

      - name: Result
        if: always()
        env:
          STATUS: ${{ steps.fuzz.outputs.status }}
        run: |
          case "$STATUS" in
            0) echo "corpus pruned" ;;
            3) echo "fuzzing found a new crash; see the private advisory linked above" >&2; exit 1 ;;
            *) echo "fuzz infrastructure failure" >&2; exit 1 ;;
          esac

  coverage:
    if: github.event.schedule == '41 4 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'coverage')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Coverage needs its own source-based-coverage build (plan 02-08); it is not an ASan build.
      - name: Build fuzzers (coverage)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          sanitizer: coverage
          github-token: ${{ github.token }}
          upload-build: false
          keep-unaffected-fuzz-targets: true

      - name: Mint corpus token (clone)
        id: clone-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      - name: Clone the private corpus
        id: clone
        env:
          CORPUS_TOKEN: ${{ steps.clone-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            clone --quiet https://github.com/rick-rami94/spinarr-fuzz-corpus.git "$RUNNER_TEMP/corpus-repo"

      - name: Allow ASan on GitHub runners
        run: sudo sysctl vm.mmap_rnd_bits=28

      # The HTML report stays on the runner; only the totals go to the private repo.
      - name: Coverage over the corpus
        id: fuzz
        run: |
          status=0
          sh scripts/fuzz-run.sh --mode coverage --seconds 600 --build-out build-out \
            --corpus "$RUNNER_TEMP/corpus-repo/corpus" --crashes "$RUNNER_TEMP/crashes" \
            --log "$RUNNER_TEMP/fuzz.log" --report "$RUNNER_TEMP/coverage" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" -eq 0 ] || { echo "fuzz infrastructure failure" >&2; exit 1; }

      - name: Mint corpus token (push)
        id: push-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FUZZ_APP_ID }}
          private-key: ${{ secrets.FUZZ_APP_PRIVATE_KEY }}
          owner: rick-rami94
          repositories: spinarr-fuzz-corpus
          permission-contents: write

      - name: Record the coverage summary in the private repo
        env:
          CORPUS_TOKEN: ${{ steps.push-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$CORPUS_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          day=$(date -u +%F)
          cd "$RUNNER_TEMP/corpus-repo"
          mkdir -p "coverage/$day"
          cp "$RUNNER_TEMP/coverage/summary.txt" "coverage/$day/summary.txt"
          git add coverage
          if git diff --cached --quiet; then echo "coverage unchanged"; exit 0; fi
          git -c user.name=spinarr-fuzz-bot -c user.email=noreply@github.com \
            commit --quiet -m "weekly coverage: $day"
          branch=$(git symbolic-ref --short HEAD)
          for attempt in 1 2 3; do
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push --quiet origin "HEAD:$branch"; then exit 0; fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" pull --quiet --rebase origin "$branch"
          done
          echo "push to the private corpus failed" >&2
          exit 1
