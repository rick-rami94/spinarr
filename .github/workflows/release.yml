name: Release

# Builds the installers on each OS and attaches them to a draft GitHub Release.
# Push a tag like v0.2.0 (or run manually, or open a PR that touches packaging, to just get the artifacts).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Build (but don't publish) the installers when a PR touches packaging or the engine.
  pull_request:
    paths: ['.github/workflows/release.yml', 'package.json', 'package-lock.json', 'build/**', 'engine/**', 'app/main.js', 'app/platform.js']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: --mac --arm64 }
          - { name: macos-x64, os: macos-15-intel, target: --mac --x64 }
          - { name: linux-x64, os: ubuntu-22.04, target: --linux --x64 }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: --linux --arm64 }
          - { name: windows-x64, os: windows-latest, target: --win --x64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache engine dependencies
        uses: actions/cache@v4
        with:
          path: engine/deps/*.tar.xz
          key: engine-src-${{ runner.os }}-${{ hashFiles('engine/build.sh') }}

      # ---- engine (built natively on each OS: ffmpeg + scanners, static, with our patches) ----
      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja nasm pkg-config && npm run engine
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build nasm pkg-config patch xz-utils
          pip3 install --user 'meson>=1.3'
          npm run engine
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make patch tar xz curl diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: sh engine/build.sh

      # ---- app ----
      - run: npm ci
      - name: Package
        shell: bash
        env:
          # Unsigned unless signing secrets are configured (see docs/RELEASING.md).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          [ -n "$CSC_LINK" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: spinarr-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
