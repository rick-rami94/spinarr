name: Release

# Builds the installers on each OS and attaches them to a draft GitHub Release.
# Push a tag like v0.2.0 (or run manually, or open a PR that touches packaging, to just get the artifacts).
#
# Supply chain: every action is pinned to a commit SHA (Dependabot keeps them fresh), Node and
# meson are pinned (.nvmrc, .github/requirements-build.txt with --require-hashes), runner images
# are pinned, and this workflow restores NO caches: it publishes artifacts, so a poisoned cache
# could flow straight into an installer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Build (but don't publish) the installers when a PR touches packaging or the engine.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/requirements-build.txt'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'engine/**'
      - 'scripts/**'
      - 'THIRD_PARTY_NOTICES.txt'
      - 'app/main.js'
      - 'app/platform.js'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: --mac --arm64, sign: mac }
          - { name: macos-x64, os: macos-15-intel, target: --mac --x64, sign: mac }
          - { name: linux-x64, os: ubuntu-22.04, target: --linux --x64, sign: none }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: --linux --arm64, sign: none }
          - { name: windows-x64, os: windows-2025, target: --win --x64, sign: win }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Signing secrets live only in the `release` environment, which deploys only from v* tags.
    # PR, branch and manual runs (and the Linux legs) get no environment, so no secrets, and
    # build unsigned (D-04).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.sign != 'none' && 'release' || '' }}
    permissions:
      contents: read
      # Only for azure/login OIDC on the Windows leg. Entra trusts only the subject
      # repo:rick-rami94/spinarr:environment:release, so other runs cannot sign.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache here on purpose (cache poisoning in a publishing workflow). setup-node v5+
      # turns caching on automatically from package.json, so switch it off explicitly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # ---- engine (built natively on each OS: ffmpeg + scanners, static, with our patches) ----
      # Engine source tarballs are always downloaded fresh; engine/build.sh verifies their SHA-256.
      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        # Documented exception to the pinning rule: Homebrew formulas float and cannot be pinned cheaply.
        run: brew install meson ninja nasm pkg-config && npm run engine
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        # apt packages come from the signed Ubuntu archive (documented exception to the pinning rule).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build nasm pkg-config patch xz-utils
          pip3 install --user --require-hashes -r .github/requirements-build.txt
          npm run engine
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          # Documented exception to the pinning rule: pacman packages float (signed MSYS2 repos).
          update: true
          install: >-
            make patch tar xz curl diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: sh engine/build.sh

      # ---- signing (D-07: sign when the credentials exist, fail when they are half there) ----
      # Values are only tested for presence and never printed.
      - name: Detect signing
        id: signing
        shell: bash
        env:
          SIGN: ${{ matrix.sign }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: |
          # all|none|half over the named variables (by name, so values never reach the log).
          state() {
            set=0
            for v in "$@"; do
              if [ -n "${!v}" ]; then set=$((set + 1)); fi
            done
            if [ "$set" -eq "$#" ]; then echo all; elif [ "$set" -eq 0 ]; then echo none; else echo half; fi
          }
          mac=false
          win=false
          case "$SIGN" in
            mac)
              s=$(state MAC_CERT_P12_BASE64 APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER)
              if [ "$s" = half ]; then
                echo "::error::macOS signing is half-configured: MAC_CERT_P12_BASE64, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID and APPLE_API_ISSUER must all be set (or none)"
                exit 1
              fi
              if [ "$s" = all ]; then mac=true; fi
              ;;
            win)
              s=$(state AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE)
              if [ "$s" = half ]; then
                echo "::error::Windows signing is half-configured: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_CERT_PROFILE must all be set (or none)"
                exit 1
              fi
              if [ "$s" = all ]; then win=true; fi
              ;;
          esac
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "win=$win" >> "$GITHUB_OUTPUT"
          echo "Signing for this leg: mac=$mac win=$win"

      # Must match MODULE_VERSION in build/sign-win.js, which imports exactly this version
      # (test/unit/workflows.test.js enforces it). Documented exception to the pinning rule:
      # the module downloads its own NuGet signing client at a module-internal version.
      - name: Install pinned ArtifactSigning module
        if: steps.signing.outputs.win == 'true'
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.20 -Repository PSGallery -Force -Scope CurrentUser

      # ---- app ----
      - run: npm ci

      # Log in right before packaging so the Entra token is fresh when signing starts.
      - name: Azure login (OIDC)
        if: steps.signing.outputs.win == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package
        shell: bash
        env:
          # Unsigned unless signing credentials are configured (see docs/RELEASING.md).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          MAC_SIGN: ${{ steps.signing.outputs.mac }}
          WIN_SIGN: ${{ steps.signing.outputs.win }}
          TARGET: ${{ matrix.target }}
        run: |
          EXTRA=
          if [ "$MAC_SIGN" = true ]; then
            # electron-builder signs, notarizes and staples the .app. APPLE_API_KEY is a path.
            umask 077
            APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
            export APPLE_API_KEY
            # Fail instead of silently producing an unsigned app.
            EXTRA="-c.mac.forceCodeSigning=true"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          unset APPLE_API_KEY_P8_BASE64
          if [ "$WIN_SIGN" = true ]; then
            # build/sign-win.js throws instead of skipping a file.
            export SPINARR_REQUIRE_SIGNING=1
          else
            unset AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE
          fi
          # TARGET is a fixed matrix value with two words (e.g. --mac --arm64); split on purpose.
          # shellcheck disable=SC2086
          npx electron-builder $TARGET $EXTRA --publish never

      # electron-builder notarizes the .app but not the dmg it builds afterwards (RESEARCH Pattern 2).
      - name: Notarize and staple the dmg
        if: steps.signing.outputs.mac == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          P8="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          if [ ! -s "$P8" ]; then
            umask 077
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$P8"
          fi
          set -- dist/*.dmg
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one dmg in dist"; exit 1; }
          DMG=$1
          codesign -dvv "$DMG" 2>&1 | grep -q 'Authority=Developer ID Application' \
            || { echo "::error::$DMG is not signed with a Developer ID Application certificate"; exit 1; }
          xcrun notarytool submit "$DMG" --key "$P8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
      - name: Verify macOS signing
        if: steps.signing.outputs.mac == 'true'
        run: sh build/verify-mac.sh dist
      - name: Verify Windows signing
        if: steps.signing.outputs.win == 'true'
        shell: pwsh
        run: pwsh -NoProfile -File build/verify-win.ps1 -Dist dist
      - name: Remove the notary key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spinarr-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

      # What this leg's signing state was, for the release notes and pre-release flag. Kept in
      # its own artifact so it never becomes a release asset. Linux is not code-signed (null);
      # cosign and the attestations cover it.
      - name: Signing marker
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          SIGN: ${{ matrix.sign }}
          MAC_SIGNED: ${{ steps.signing.outputs.mac }}
          WIN_SIGNED: ${{ steps.signing.outputs.win }}
        run: |
          case "$SIGN" in
            mac) platform=mac; signed=$MAC_SIGNED ;;
            win) platform=win; signed=$WIN_SIGNED ;;
            *) platform=linux; signed=null ;;
          esac
          [ -n "$signed" ] || signed=false
          mkdir -p dist-marker
          printf '{ "name": "%s", "platform": "%s", "signed": %s }\n' "$NAME" "$platform" "$signed" > "dist-marker/signing-$NAME.json"
          cat "dist-marker/signing-$NAME.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-${{ matrix.name }}
          if-no-files-found: error
          path: dist-marker/signing-${{ matrix.name }}.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: out/*
