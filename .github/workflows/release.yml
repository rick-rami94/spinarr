name: Release

# Builds the installers on each OS and attaches them to a draft GitHub Release.
# Push a tag like v0.2.0 (or run manually, or open a PR that touches packaging, to just get the artifacts).
#
# Supply chain: every action is pinned to a commit SHA (Dependabot keeps them fresh), Node and
# meson are pinned (.nvmrc, .github/requirements-build.txt with --require-hashes), runner images
# are pinned, and this workflow restores NO caches: it publishes artifacts, so a poisoned cache
# could flow straight into an installer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Build (but don't publish) the installers when a PR touches packaging or the engine.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/requirements-build.txt'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'engine/**'
      - 'app/main.js'
      - 'app/platform.js'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15, target: --mac --arm64 }
          - { name: macos-x64, os: macos-15-intel, target: --mac --x64 }
          - { name: linux-x64, os: ubuntu-22.04, target: --linux --x64 }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: --linux --arm64 }
          - { name: windows-x64, os: windows-2025, target: --win --x64 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache here on purpose (cache poisoning in a publishing workflow). setup-node v5+
      # turns caching on automatically from package.json, so switch it off explicitly.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # ---- engine (built natively on each OS: ffmpeg + scanners, static, with our patches) ----
      # Engine source tarballs are always downloaded fresh; engine/build.sh verifies their SHA-256.
      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        # Documented exception to the pinning rule: Homebrew formulas float and cannot be pinned cheaply.
        run: brew install meson ninja nasm pkg-config && npm run engine
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        # apt packages come from the signed Ubuntu archive (documented exception to the pinning rule).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build nasm pkg-config patch xz-utils
          pip3 install --user --require-hashes -r .github/requirements-build.txt
          npm run engine
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          # Documented exception to the pinning rule: pacman packages float (signed MSYS2 repos).
          update: true
          install: >-
            make patch tar xz curl diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
      - name: Build engine (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: sh engine/build.sh

      # ---- app ----
      - run: npm ci
      - name: Package
        shell: bash
        env:
          # Unsigned unless signing secrets are configured (see docs/RELEASING.md).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          TARGET: ${{ matrix.target }}
        run: |
          [ -n "$CSC_LINK" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          # TARGET is a fixed matrix value with two words (e.g. --mac --arm64); split on purpose.
          # shellcheck disable=SC2086
          npx electron-builder $TARGET --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spinarr-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: out/*
