<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <title>Spinarr</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Sources and rips">
      <div class="chrome"></div>
      <div class="side-scroll">
        <section class="side-section">
          <h2 class="section-label">Discs</h2>
          <div id="sources" role="list"></div>
          <button class="side-btn" id="openBtn">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            <span>Open image or folder…</span>
            <kbd data-keys="⌘O">⌘O</kbd>
          </button>
          <button class="side-btn" id="openFolderBtn" hidden>
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
            <span>Open disc folder…</span>
            <kbd data-keys="⇧⌘O">⇧⌘O</kbd>
          </button>
        </section>

        <section class="side-section queue">
          <div class="queue-head">
            <h2 class="section-label">Rips <span class="count" id="queueCount"></span></h2>
            <button class="link-btn" id="clearBtn" hidden>Clear finished</button>
          </div>
          <div id="queueList" aria-live="polite"></div>
        </section>
      </div>

      <footer class="side-foot">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/><path class="mark-arc" d="M12 5.2a6.8 6.8 0 0 1 6.8 6.8"/></svg>
        <span class="wordmark">Spinarr</span>
        <button class="setup-btn" id="setupBtn" hidden><span class="dot"></span>Finish setup</button>
      </footer>
    </aside>

    <div class="stage">
      <div class="chrome stage-chrome">
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
      </div>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
    <div class="drop-card">
      <div class="disc drop-disc"></div>
      <div class="drop-title">Drop to scan</div>
      <div class="drop-sub">ISO image · VIDEO_TS · BDMV folder</div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog id="settingsDlg" aria-labelledby="settingsTitle">
    <form method="dialog" class="settings">
      <header class="dlg-head">
        <h2 id="settingsTitle">Settings</h2>
        <p>Applies to every disc you rip.</p>
      </header>

      <div class="group">
        <div class="group-row">
          <div class="gr-text"><b>Output folder</b><output id="setOutput" class="path-readout"></output></div>
          <button type="button" class="ghost-btn" id="setOutputBtn">Change…</button>
        </div>
        <div class="group-row">
          <div class="gr-text"><b>Hide short titles</b><small>Menus, trailers and logos usually run under a few minutes.</small></div>
          <div class="stepper">
            <button type="button" data-step="-1" aria-label="Fewer minutes">−</button>
            <input id="setMin" type="number" min="0" max="60" aria-label="Minimum minutes" />
            <span class="unit">min</span>
            <button type="button" data-step="1" aria-label="More minutes">+</button>
          </div>
        </div>
      </div>

      <div class="group">
        <label class="group-row switch-row">
          <div class="gr-text"><b>Accurate chapter markers</b><small>Reads the disc twice, so rips take about twice as long. Chapters are already accurate to a fraction of a second without it.</small></div>
          <input type="checkbox" class="switch" id="setChapters" />
        </label>
      </div>

      <div class="group-title">System</div>
      <div class="group" id="systemGroup"></div>

      <div class="dlg-actions"><button class="primary-btn" value="ok" autofocus>Done</button></div>
    </form>
  </dialog>

  <script src="format.js"></script>
  <script src="app.js"></script>
</body>
</html>
